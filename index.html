<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeFury - Combates Fréneticos</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="auth-screen">
        <div class="auth-bg-particles" id="particles"></div>
        <div class="auth-container">
            <div class="auth-brand">
                <img src="assets/pokefury-logo.png" alt="PokeFury" class="auth-logo">
                <p class="auth-tagline">Combates Fréneticos de Alta Qualidade</p>
            </div>

            <div class="auth-card" id="auth-card">
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Entrar</button>
                    <button class="auth-tab" data-tab="register">Criar Conta</button>
                    <div class="auth-tab-indicator"></div>
                </div>

                <form id="login-form" class="auth-form active">
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <input type="text" id="login-username" placeholder="Nome de treinador" required autocomplete="username">
                        <div class="input-line"></div>
                    </div>
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <input type="password" id="login-password" placeholder="Senha" required autocomplete="current-password">
                        <div class="input-line"></div>
                        <button type="button" class="toggle-password" data-target="login-password">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember-me">
                            <span class="checkmark"></span>
                            Lembrar de mim
                        </label>
                    </div>
                    <button type="submit" class="auth-submit">
                        <span>Entrar na Batalha</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                    <div class="auth-error hidden" id="login-error"></div>
                </form>

                <form id="register-form" class="auth-form">
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <input type="text" id="reg-username" placeholder="Nome de treinador" required autocomplete="username">
                        <div class="input-line"></div>
                    </div>
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </div>
                        <input type="email" id="reg-email" placeholder="E-mail" required autocomplete="email">
                        <div class="input-line"></div>
                    </div>
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <input type="password" id="reg-password" placeholder="Senha (min. 6 caracteres)" required minlength="6" autocomplete="new-password">
                        <div class="input-line"></div>
                        <button type="button" class="toggle-password" data-target="reg-password">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </div>
                        <input type="password" id="reg-confirm" placeholder="Confirmar senha" required minlength="6" autocomplete="new-password">
                        <div class="input-line"></div>
                    </div>
                    <div class="password-strength" id="password-strength">
                        <div class="strength-bar"><div class="strength-fill"></div></div>
                        <span class="strength-text"></span>
                    </div>
                    <button type="submit" class="auth-submit register-submit">
                        <span>Criar Conta</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                    </button>
                    <div class="auth-error hidden" id="register-error"></div>
                </form>

                <div class="auth-divider">
                    <span>ou continue com</span>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn google-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        <span>Google</span>
                    </button>
                    <button type="button" class="social-btn discord-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                        <span>Discord</span>
                    </button>
                    <button type="button" class="social-btn github-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                        <span>GitHub</span>
                    </button>
                </div>
            </div>

            <p class="auth-footer">© 2026 PokeFury. Todos os direitos reservados.</p>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div id="title-screen">
                <img src="assets/pokefury-logo.png" alt="PokeFury" class="game-logo">
                <p class="subtitle">Combates Fréneticos de Alta Qualidade</p>
                <div class="menu-buttons">
                    <button id="btn-new-game" class="menu-btn">NOVO JOGO</button>
                    <button id="btn-continue" class="menu-btn" disabled>CONTINUAR</button>
                    <button id="btn-settings" class="menu-btn">OPÇÕES</button>
                </div>
                <button id="btn-logout" class="logout-btn">Sair da conta</button>
            </div>

            <div id="battle-screen" class="hidden">
                <div id="battle-ui">
                    <div id="player-info" class="trainer-info">
                        <div class="trainer-sprite"></div>
                        <div class="trainer-details">
                            <span class="trainer-name"></span>
                            <div class="pokemon-team"></div>
                        </div>
                    </div>
                    <div id="enemy-info" class="trainer-info">
                        <div class="trainer-details">
                            <span class="trainer-name"></span>
                            <div class="pokemon-team"></div>
                        </div>
                        <div class="trainer-sprite"></div>
                    </div>
                    <div id="battle-log">
                        <p id="battle-message"></p>
                    </div>
                    <div id="battle-actions">
                        <button class="action-btn" data-action="fight">ATACAR</button>
                        <button class="action-btn" data-action="pokemon">POKEMON</button>
                        <button class="action-btn" data-action="bag">MOCHILA</button>
                        <button class="action-btn" data-action="run">CORRER</button>
                    </div>
                    <div id="move-selection" class="hidden">
                        <div id="move-buttons"></div>
                        <button id="btn-back" class="action-btn small">VOLTAR</button>
                    </div>
                </div>
            </div>

            <div id="hud" class="hidden">
                <div id="hud-top">
                    <span id="player-name-hud"></span>
                    <span id="location-name"></span>
                </div>
                <div id="hud-bottom">
                    <div id="party-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/game-data.js"></script>
    <script src="js/auth.js"></script>
    <script type="module" src="js/data.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/battle.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/game.js"></script>
</body>
</html>
