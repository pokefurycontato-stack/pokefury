<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>PokeFury Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: #0d0f1a;
            color: #fff;
            font-family: Inter, sans-serif;
            overflow: hidden;
        }
        .layout { display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 210px; flex-shrink: 0; background: #12142a;
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column;
        }
        .brand { padding: 20px 18px; font-size: 18px; font-weight: 900; letter-spacing: 0.5px; }
        .brand span { color: #e94560; }
        .nav { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
        .nav-btn {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 11px 14px; border: none; border-radius: 8px; background: transparent;
            color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: Inter, sans-serif; text-align: left;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .nav-btn.active { background: linear-gradient(135deg, rgba(233,69,96,0.25), rgba(194,49,82,0.18)); color: #fff; }
        .sidebar-footer { padding: 14px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px; }
        .chip { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); padding: 6px 12px; border-radius: 20px; font-size: 12px; word-break: break-word; }
        .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .dot.on { background: #22c55e; }
        a.back { color: #60a5fa; text-decoration: none; font-size: 12px; }

        /* Main */
        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .view { height: 100%; overflow-y: auto; }
        .view.hidden { display: none; }
        #view-game { display: flex; flex-direction: column; overflow: hidden; }
        #view-game.hidden { display: none; }

        /* Security view */
        .sec-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 22px 0; }
        .sec-header h1 { font-size: 20px; font-weight: 900; }
        .sec-header h1 span { color: #e94560; }
        .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 22px 12px; }
        .toolbar button, .toolbar select {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: Inter, sans-serif;
        }
        .toolbar button:hover { background: rgba(255,255,255,0.16); }
        .toolbar .updated { font-size: 12px; color: rgba(255,255,255,0.45); }
        .sec-body { padding: 0 22px 22px; }
        .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th {
            text-align: left; padding: 10px 12px; background: rgba(255,255,255,0.06);
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: rgba(255,255,255,0.55);
        }
        tbody td { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.06); vertical-align: top; }
        tbody tr:hover { background: rgba(255,255,255,0.03); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.function_tamper { background: rgba(233,69,96,0.2); color: #ff6b81; }
        .badge.rate_limit { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .badge.client_error { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .badge.server_reject { background: rgba(168,85,247,0.2); color: #c084fc; }
        .badge.anomaly { background: rgba(139,92,246,0.2); color: #a78bfa; }
        .badge.other { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }
        .mono { font-family: 'Consolas', monospace; font-size: 12px; color: rgba(255,255,255,0.75); }
        .detail { font-size: 11px; color: rgba(255,255,255,0.55); max-width: 280px; word-break: break-word; }
        .time { white-space: nowrap; color: rgba(255,255,255,0.55); font-size: 12px; }
        .btn-ban { padding: 5px 10px; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: Inter, sans-serif; }
        .btn-ban.ban { background: #e94560; color: #fff; }
        .btn-ban.unban { background: rgba(255,255,255,0.14); color: #fff; }
        .banned-flag { color: #ff6b81; font-weight: 700; font-size: 11px; }
        .empty { padding: 40px; text-align: center; color: rgba(255,255,255,0.4); }
        .online-sort {
            background: none; border: none; padding: 0; margin: 0; cursor: pointer;
            color: rgba(255,255,255,0.55); font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.6px; font-family: Inter, sans-serif;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .online-sort:hover { color: #fff; }
        .sort-ic { font-size: 10px; color: rgba(255,255,255,0.35); }

        /* Game view */
        .game-toolbar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 10px 16px; background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0;
        }
        .game-toolbar .title { font-size: 13px; font-weight: 700; }
        .game-toolbar .hint { font-size: 12px; color: rgba(255,255,255,0.45); }
        .game-toolbar button {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: Inter, sans-serif;
        }
        .game-toolbar button:hover { background: rgba(255,255,255,0.18); }
        .iframe-wrap { flex: 1; position: relative; min-height: 0; }
        .iframe-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

        /* Login / denied */
        .login-box { max-width: 380px; margin: 80px auto; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 28px; }
        .login-box h2 { font-size: 20px; margin-bottom: 18px; }
        .login-box input { width: 100%; padding: 11px 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; font-family: Inter, sans-serif; }
        .login-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #e94560; color: #fff; font-weight: 700; cursor: pointer; font-family: Inter, sans-serif; }
        .error { color: #ff6b81; font-size: 13px; margin-top: 10px; }
        .denied { text-align: center; padding: 80px 20px; color: rgba(255,255,255,0.7); }
        .denied h2 { color: #ff6b81; margin-bottom: 12px; }

        /* Player Detail Popup */
        .pd-overlay {
            position:fixed;inset:0;z-index:9999;
            background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);
            display:flex;align-items:center;justify-content:center;
            animation:pdFadeIn .2s ease;
        }
        @keyframes pdFadeIn{from{opacity:0}to{opacity:1}}
        @keyframes pdSlideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .pd-card {
            background:#12142a;border:1px solid rgba(255,255,255,0.15);
            border-radius:16px;width:94%;max-width:680px;
            max-height:90vh;overflow:hidden;
            box-shadow:0 25px 60px rgba(0,0,0,0.6);
            animation:pdSlideIn .25s ease;
        }
        .pd-head {
            padding:18px 22px;display:flex;align-items:center;gap:16px;
            background:linear-gradient(135deg,rgba(233,69,96,0.15),rgba(194,49,82,0.08));
            border-bottom:1px solid rgba(255,255,255,0.08);position:relative;
        }
        .pd-head .pd-close {
            position:absolute;top:12px;right:14px;background:none;border:none;
            color:rgba(255,255,255,0.5);font-size:22px;cursor:pointer;
            width:32px;height:32px;display:flex;align-items:center;justify-content:center;
            border-radius:8px;transition:all .15s;
        }
        .pd-head .pd-close:hover{background:rgba(255,255,255,0.1);color:#fff}
        .pd-avatar {
            width:60px;height:60px;border-radius:50%;object-fit:contain;
            background:rgba(255,255,255,0.08);border:2px solid rgba(233,69,96,0.5);
            flex-shrink:0;
        }
        .pd-avatar-fallback {
            width:60px;height:60px;border-radius:50%;
            background:linear-gradient(135deg,#e94560,#7c3aed);
            display:flex;align-items:center;justify-content:center;
            font-size:26px;font-weight:900;color:#fff;flex-shrink:0;
            border:2px solid rgba(233,69,96,0.5);
        }
        .pd-info-main h2{font-size:17px;font-weight:800;margin:0 0 2px}
        .pd-info-main .pd-level{font-size:12px;color:#e94560;font-weight:700}
        .pd-info-main .pd-sub{font-size:11px;color:rgba(255,255,255,0.45);margin-top:2px}
        .pd-body {
            padding:18px 22px;overflow-y:auto;max-height:calc(90vh - 90px);
        }
        .pd-section{margin-bottom:16px}
        .pd-section-title {
            font-size:10px;font-weight:800;text-transform:uppercase;
            letter-spacing:1px;color:rgba(255,255,255,0.45);margin-bottom:8px;
            padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.06);
            display:flex;align-items:center;gap:8px;
        }
        .pd-section-title .pd-live-dot {
            width:6px;height:6px;border-radius:50%;background:#22c55e;
            animation:pdPulse 2s infinite;
        }
        @keyframes pdPulse{0%,100%{opacity:1}50%{opacity:0.4}}
        .pd-details-grid {
            display:grid;grid-template-columns:1fr 1fr;gap:6px;
        }
        .pd-detail-item {
            display:flex;justify-content:space-between;padding:5px 8px;
            background:rgba(255,255,255,0.03);border-radius:6px;
            border:1px solid rgba(255,255,255,0.05);
        }
        .pd-detail-item .pd-label{font-size:11px;color:rgba(255,255,255,0.4)}
        .pd-detail-item .pd-value{font-size:11px;font-weight:700;color:#fff}
        .pd-team-grid {
            display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:8px;
        }
        .pd-team-slot {
            background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
            border-radius:10px;padding:8px;text-align:center;position:relative;
            transition:all .15s;
        }
        .pd-team-slot:hover{background:rgba(255,255,255,0.08);transform:translateY(-1px)}
        .pd-team-slot img {
            width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }
        .pd-team-slot .pd-poke-name{font-size:10px;font-weight:700;margin-top:4px;color:#fff}
        .pd-team-slot .pd-poke-level{font-size:9px;color:rgba(255,255,255,0.5)}
        .pd-team-slot .pd-shiny-badge {
            position:absolute;top:4px;right:4px;font-size:10px;
        }
        .pd-team-slot .pd-slot-num {
            position:absolute;top:4px;left:5px;font-size:8px;font-weight:800;
            color:rgba(255,255,255,0.25);
        }
        .pd-team-slot .pd-hp-bar {
            width:100%;height:3px;background:rgba(255,255,255,0.1);
            border-radius:2px;margin-top:3px;overflow:hidden;
        }
        .pd-team-slot .pd-hp-fill{height:100%;border-radius:2px;transition:width .3s}
        .pd-boosts-list{display:flex;flex-wrap:wrap;gap:6px}
        .pd-boost-badge {
            padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;
            background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:#4ade80;
            display:flex;align-items:center;gap:5px;
        }
        .pd-boost-badge .pd-boost-exp{font-size:9px;color:rgba(255,255,255,0.4);font-weight:400}
        .pd-currencies-grid{display:flex;gap:10px;flex-wrap:wrap}
        .pd-currency-card {
            flex:1;min-width:100px;background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);border-radius:10px;
            padding:12px;text-align:center;
        }
        .pd-currency-card .pd-cur-icon{font-size:22px;margin-bottom:4px}
        .pd-currency-card .pd-cur-amount{font-size:16px;font-weight:900;color:#fff}
        .pd-currency-card .pd-cur-label{font-size:9px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.5px}
        .pd-empty {
            text-align:center;padding:16px;color:rgba(255,255,255,0.3);font-size:12px;
            font-style:italic;
        }
        .pd-loading{text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-size:12px}
        .pd-loading::after{content:'';display:inline-block;width:14px;height:14px;
            border:2px solid rgba(255,255,255,0.15);border-top-color:#e94560;
            border-radius:50%;animation:pdSpin .6s linear infinite;margin-left:8px;vertical-align:middle;}
        @keyframes pdSpin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        const app = document.getElementById('app');
        const GAME_URL = 'index.html?overworld=1';
        const TYPE_COLORS = {
            function_tamper: 'function_tamper', rate_limit: 'rate_limit',
            client_error: 'client_error', server_reject: 'server_reject', anomaly: 'anomaly'
        };

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function fmtTime(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        async function ensureSession() {
            const { data: { session } } = await window.db.auth.getSession();
            if (session) return session;
            return new Promise((resolve) => {
                app.innerHTML = `
                    <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#0d0f1a;">
                        <div class="login-box">
                            <h2>PokeFury Admin</h2>
                            <input id="adm-email" type="email" placeholder="E-mail" autocomplete="username">
                            <input id="adm-pass" type="password" placeholder="Senha" autocomplete="current-password">
                            <button id="adm-login">Entrar</button>
                            <div class="error" id="adm-error"></div>
                        </div>
                    </div>`;
                document.getElementById('adm-login').addEventListener('click', async () => {
                    const email = document.getElementById('adm-email').value.trim();
                    const password = document.getElementById('adm-pass').value;
                    const { error } = await window.db.auth.signInWithPassword({ email, password });
                    if (error) {
                        document.getElementById('adm-error').textContent = 'E-mail ou senha inválidos.';
                    } else {
                        window.db.auth.getSession().then(r => resolve(r.data.session));
                    }
                });
            });
        }

        async function checkAdmin() {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) return false;
            const { data: profile } = await window.db.from('profiles').select('is_admin, username').eq('id', session.user.id).single();
            return !!(profile && profile.is_admin);
        }

        let currentFilter = 'all';

        async function loadEvents() {
            try {
                const { data } = await window.db.rpc('get_security_events', { p_limit: 200 });
                if (data && data.success) {
                    renderTable(data.events || []);
                    const el = document.getElementById('updated-at');
                    if (el) el.textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR');
                }
            } catch (e) {
                const el = document.getElementById('updated-at');
                if (el) el.textContent = 'erro ao carregar';
            }
        }

        async function loadDevices() {
            const panel = document.getElementById('device-panel');
            if (!panel) return;
            const list = document.getElementById('device-list');
            if (!list) return;
            try {
                const { data } = await window.db.rpc('get_banned_devices');
                if (data && data.success) {
                    const devices = data.devices || [];
                    list.innerHTML = devices.length
                        ? devices.map(d => {
                            const users = (d.users || []).join(', ') || '—';
                            return `<tr>
                                <td class="time">${fmtTime(d.created_at)}</td>
                                <td class="mono">${esc(d.device_hash)}</td>
                                <td>${esc(d.reason || '—')}</td>
                                <td>${esc(users)}</td>
                                <td>
                                    <button class="btn-ban unban" onclick="unbanDevice('${esc((d.device_hash || '').replace(/'/g, "\\'"))}')">Desbanir</button>
                                </td>
                            </tr>`;
                        }).join('')
                        : '<tr><td colspan="5" class="empty">Nenhum dispositivo banido.</td></tr>';
                } else {
                    list.innerHTML = '<tr><td colspan="5" class="empty">Erro: ' + esc((data && data.error) || 'sem resposta') + '</td></tr>';
                }
            } catch (e) {
                list.innerHTML = '<tr><td colspan="5" class="empty">Falha ao carregar dispositivos.</td></tr>';
            }
        }

        function toggleDevicePanel() {
            const panel = document.getElementById('device-panel');
            if (!panel) return;
            const showing = !panel.classList.contains('hidden');
            panel.classList.toggle('hidden', showing);
            if (!showing) loadDevices();
        }

        async function unbanDevice(deviceHash) {
            if (!confirm('Deseja desbanir este dispositivo?\n' + deviceHash + '\nQualquer conta usada nele poderá jogar novamente.')) return;
            const { data, error } = await window.db.rpc('unban_device', { p_device_hash: deviceHash });
            if (error || !data || !data.success) {
                alert('Falha ao desbanir. ' + (error ? error.message : (data && data.error) || 'desconhecido'));
                return;
            }
            loadDevices();
            loadEvents();
        }

        function fmtDur(seconds) {
            if (seconds == null || isNaN(seconds)) return '—';
            if (seconds < 0) seconds = 0;
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return h + 'h ' + m + 'm';
            if (m > 0) return m + 'm ' + s + 's';
            return s + 's';
        }

        let onlineTimer = null;
        let onlineSort = { col: 'connected', dir: -1 };
        let teleportList = [];
        let teleportsLoadedAt = 0;

        // Teleporte mais proximo do jogador (por distancia ao letreiro) + coords atuais
        function teleportLabel(p) {
            if (p.pos_x == null || p.pos_y == null) {
                return '<span style="color:rgba(255,255,255,0.3);font-size:11px;">sem posição</span>';
            }
            let best = null, bestD = Infinity;
            for (const t of teleportList) {
                const dx = (t.sign_x - p.pos_x), dy = (t.sign_y - p.pos_y);
                const d = dx * dx + dy * dy;
                if (d < bestD) { bestD = d; best = t; }
            }
            if (!best) {
                return `<span style="color:rgba(255,255,255,0.3);font-size:11px;">sem teleporte</span>`;
            }
            const dist = Math.round(Math.sqrt(bestD));
            const name = esc(best.name || 'Teleporte');
            return `<span style="color:#7dd3fc;font-weight:700;font-size:12px;">${name}</span>
                    <span style="color:rgba(255,255,255,0.35);font-size:10px;margin-left:4px;">${dist}px</span>
                    <div style="font-size:10px;color:rgba(255,255,255,0.35);">x:${Math.round(p.pos_x)} y:${Math.round(p.pos_y)}</div>`;
        }

        async function loadTeleportsCache() {
            try {
                const { data } = await window.db.from('city_teleports').select('name,sign_x,sign_y');
                teleportList = (data || []).filter(t => t.sign_x != null && t.sign_y != null);
                teleportsLoadedAt = Date.now();
            } catch (e) {
                teleportList = [];
            }
        }

        function sortOnline(players) {
            const { col, dir } = onlineSort;
            return [...players].sort((a, b) => {
                switch (col) {
                    case 'name': {
                        const na = (a.player_name || '').toLowerCase();
                        const nb = (b.player_name || '').toLowerCase();
                        if (na === nb) return 0;
                        return dir * (na < nb ? -1 : 1);
                    }
                    case 'connected': {
                        const va = a.is_online ? (a.connected_seconds != null ? a.connected_seconds : Infinity) : (a.idle_seconds || 0);
                        const vb = b.is_online ? (b.connected_seconds != null ? b.connected_seconds : Infinity) : (b.idle_seconds || 0);
                        if (va === vb) return 0;
                        return dir * (va - vb);
                    }
                    case 'idle': {
                        return dir * ((a.idle_seconds || 0) - (b.idle_seconds || 0));
                    }
                    default: return 0;
                }
            });
        }

        function renderOnline(players) {
            const list = document.getElementById('online-list');
            if (!list) return;
            list.innerHTML = players.length
                ? players.map(p => {
                    const idle = p.idle_seconds;
                    const online = !!p.is_online;
                    const idleBadge = online
                        ? (idle > 420 ? `<span class="badge server_reject" style="background:rgba(233,69,96,0.25);color:#ff6b81;">${fmtDur(idle)}</span>`
                           : idle > 300 ? `<span class="badge rate_limit" style="background:rgba(245,158,11,0.25);color:#fbbf24;">${fmtDur(idle)}</span>`
                           : `<span class="badge other" style="background:rgba(34,197,94,0.2);color:#4ade80;">${fmtDur(idle)}</span>`)
                        : `<span class="badge other" style="background:rgba(148,163,184,0.2);color:#94a3b8;">${fmtDur(idle)}</span>`;
                    const statusBadge = online
                        ? `<span style="display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:1px 7px;border-radius:8px;background:rgba(34,197,94,0.18);color:#4ade80;margin-left:6px;vertical-align:middle;">Online</span>`
                        : `<span style="display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:1px 7px;border-radius:8px;background:rgba(148,163,184,0.15);color:#94a3b8;margin-left:6px;vertical-align:middle;">Offline</span>`;
                    return `<tr>
                        <td>
                            <div style="display:flex;align-items:center;gap:10px;">
                                <div onclick="showPlayerDetail('${p.user_id}', '${esc((p.player_name || '').replace(/'/g, "\\'"))}')" style="width:32px;height:32px;border-radius:50%;background:${online ? 'linear-gradient(135deg,#e94560,#7c3aed)' : 'rgba(148,163,184,0.35)'};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;cursor:pointer;transition:all .2s;border:2px solid transparent;" onmouseover="this.style.borderColor='#e94560';this.style.transform='scale(1.12)'" onmouseout="this.style.borderColor='transparent';this.style.transform='scale(1)'" title="Ver detalhes de ${esc(p.player_name || '')}">${esc((p.player_name || '?').charAt(0).toUpperCase())}</div>
                                <div>
                                    <div style="font-weight:700;color:#fff;">${esc(p.player_name || '—')}${statusBadge}</div>
                                    <div style="font-size:11px;color:rgba(255,255,255,0.4);">${esc(p.email || '—')}</div>
                                </div>
                            </div>
                        </td>
                        <td class="time">${online ? fmtDur(p.connected_seconds) : '—'}</td>
                        <td>${idleBadge}</td>
                        <td>${teleportLabel(p)}</td>
                        <td>
                            ${online
                                ? `<button class="btn-ban ban" onclick="forceLogoutPlayer('${p.user_id}', '${esc((p.player_name || '').replace(/'/g, "\\'"))}')">Desconectar</button>`
                                : `<button class="btn-ban" disabled style="background:rgba(148,163,184,0.25);color:rgba(255,255,255,0.35);cursor:not-allowed;">Desconectar</button>`}
                        </td>
                        <td>
                            <button class="btn-reset" style="background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;" onclick="resetPlayerPosition('${p.user_id}', '${esc((p.player_name || '').replace(/'/g, "\\'"))}')">Resetar posição</button>
                        </td>
                    </tr>`;
                }).join('')
                : '<tr><td colspan="6" style="padding:32px;text-align:center;color:rgba(255,255,255,0.4);">Nenhuma conta cadastrada.</td></tr>';
        }

        async function loadOnline() {
            const list = document.getElementById('online-list');
            if (!list) return;
            try {
                const { data } = await window.db.rpc('get_all_accounts');
                if (data && data.success) {
                    const players = data.players || [];
                    // Posicao em tempo real na cidade (pos_x/pos_y do city_players)
                    try {
                        const { data: cp } = await window.db.from('city_players').select('user_id,pos_x,pos_y');
                        const posMap = {};
                        (cp || []).forEach(r => { if (r.pos_x != null && r.pos_y != null) posMap[r.user_id] = r; });
                        players.forEach(p => { const m = posMap[p.user_id]; if (m) { p.pos_x = m.pos_x; p.pos_y = m.pos_y; } });
                    } catch (e) {}
                    // Cache dos teleportes (atualiza a cada 60s para pegar placas novas)
                    if (Date.now() - teleportsLoadedAt > 60000) loadTeleportsCache();
                    renderOnline(sortOnline(players));
                } else {
                    list.innerHTML = '<tr><td colspan="6" style="padding:32px;text-align:center;color:rgba(255,255,255,0.4);">Erro: ' + esc((data && data.error) || 'sem resposta') + '</td></tr>';
                }
            } catch (e) {
                list.innerHTML = '<tr><td colspan="6" style="padding:32px;text-align:center;color:rgba(255,255,255,0.4);">Falha ao carregar contas.</td></tr>';
            }
        }

        function sortOnlineBy(col) {
            if (onlineSort.col === col) onlineSort.dir = -onlineSort.dir;
            else onlineSort = { col, dir: col === 'name' ? 1 : -1 };
            document.querySelectorAll('.online-sort').forEach(el => {
                const isActive = el.dataset.sort === onlineSort.col;
                el.style.color = isActive ? '#e94560' : 'rgba(255,255,255,0.55)';
                const ic = el.querySelector('.sort-ic');
                if (ic) ic.textContent = isActive ? (onlineSort.dir > 0 ? '▲' : '▼') : '⇅';
            });
            loadOnline();
        }

        function toggleOnlinePanel() {
            const panel = document.getElementById('online-panel');
            if (!panel) return;
            const showing = !panel.classList.contains('hidden');
            panel.classList.toggle('hidden', showing);
            if (showing) {
                if (onlineTimer) { clearInterval(onlineTimer); onlineTimer = null; }
                closePlayerDetail();
            } else {
                loadOnline();
                loadTeleportsCache();
                if (onlineTimer) clearInterval(onlineTimer);
                onlineTimer = setInterval(loadOnline, 5000);
            }
        }

        async function forceLogoutPlayer(userId, name) {
            if (!confirm('Deseja desconectar ' + name + '?\nIsso encerra a sessão dele(a). Não é banimento — ele pode entrar novamente.')) return;
            const { data, error } = await window.db.rpc('force_logout', { p_user_id: userId });
            if (error || !data || !data.success) {
                alert('Falha ao desconectar. ' + (error ? error.message : (data && data.error) || 'desconhecido'));
                return;
            }
            loadOnline();
        }

        async function resetPlayerPosition(userId, name) {
            if (!confirm('Deseja resetar a posição de ' + name + '?\nEle(a) será teleportado(a) para o spawn padrão da cidade em tempo real.')) return;
            const { data, error } = await window.db.rpc('reset_player_position', { p_user_id: userId });
            if (error || !data || !data.success) {
                alert('Falha ao resetar posição. ' + (error ? error.message : (data && data.error) || 'desconhecido'));
                return;
            }
            alert('Posição de ' + name + ' resetada para o spawn da cidade.');
            loadOnline();
        }

        async function toggleBan(userId, banned, username) {
            const label = banned ? 'banir' : 'desbanir';
            if (!confirm(`Deseja ${label} o jogador ${username || userId}?`)) return;
            const { data, error } = await window.db.rpc('set_player_banned', { p_user_id: userId, p_banned: banned });
            if (error || !data || !data.success) {
                alert('Falha ao ' + label + '. Erro: ' + (error ? error.message : (data && data.error) || 'desconhecido'));
                return;
            }
            await loadEvents();
        }

        function renderTable(events) {
            const filtered = currentFilter === 'all' ? events : events.filter(e => e.event_type === currentFilter);
            const rows = filtered.map(e => {
                const badge = TYPE_COLORS[e.event_type] || 'other';
                const isBanned = !!e.is_banned;
                let detail = '';
                try { detail = typeof e.detail === 'string' ? e.detail : JSON.stringify(e.detail || {}); } catch (err) { detail = ''; }
                return `<tr>
                    <td class="time">${fmtTime(e.created_at)}</td>
                    <td>
                        <div><strong>${esc(e.username || e.player_name || '—')}</strong> ${isBanned ? '<span class="banned-flag">BANIDO</span>' : ''}</div>
                        <div class="mono">${esc(e.user_id || '')}</div>
                    </td>
                    <td><span class="badge ${badge}">${esc(e.event_type)}</span></td>
                    <td class="mono">${esc(e.function_name || '—')}</td>
                    <td><div class="detail">${esc(detail)}</div></td>
                    <td>
                        <button class="btn-ban ${isBanned ? 'unban' : 'ban'}" onclick="toggleBan('${e.user_id}', ${isBanned ? 'false' : 'true'}, '${esc((e.username || '').replace(/'/g, "\\'"))}')">
                            ${isBanned ? 'Desbanir' : 'Banir'}
                        </button>
                    </td>
                </tr>`;
            }).join('');

            const listEl = document.getElementById('event-list');
            if (listEl) listEl.innerHTML = rows || '<tr><td colspan="6" style="padding:32px;text-align:center;color:rgba(255,255,255,0.4);">Nenhum evento registrado.</td></tr>';
        }

        function switchView(view) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
            document.getElementById('view-security').classList.toggle('hidden', view !== 'security');
            document.getElementById('view-game').classList.toggle('hidden', view !== 'game');
            if (view === 'game') {
                const frame = document.getElementById('game-frame');
                if (frame && !frame.src) frame.src = GAME_URL;
            }
        }

        function renderAdmin(session) {
            const username = session.user.user_metadata && (session.user.user_metadata.username || session.user.email) || session.user.email;
            app.innerHTML = `
                <div class="layout">
                    <aside class="sidebar">
                        <div class="brand">PokeFury <span>Admin</span></div>
                        <nav class="nav">
                            <button class="nav-btn active" data-view="security">🛡️ Segurança</button>
                            <button class="nav-btn" data-view="game">🕹️ Jogo / Admin</button>
                        </nav>
                        <div class="sidebar-footer">
                            <div class="chip"><span class="dot on"></span>${esc(username)}</div>
                            <a class="back" href="${GAME_URL}" target="_blank">abrir o jogo em nova aba ↗</a>
                        </div>
                    </aside>

                    <main class="main">
                        <section id="view-security" class="view">
                            <div class="sec-header">
                                <h1>🛡️ Segurança</h1>
                            </div>
                            <div class="toolbar">
                                <button onclick="loadEvents()">Atualizar</button>
                                <button onclick="toggleOnlinePanel()">👥 Todas as contas</button>
                                <button onclick="toggleDevicePanel()">📵 Dispositivos banidos</button>
                                <select id="filter-type" onchange="currentFilter=this.value;loadEvents()">
                                    <option value="all">Todos os eventos</option>
                                    <option value="function_tamper">function_tamper</option>
                                    <option value="rate_limit">rate_limit</option>
                                    <option value="client_error">client_error</option>
                                    <option value="server_reject">server_reject</option>
                                    <option value="anomaly">anomaly</option>
                                </select>
                                <span class="updated" id="updated-at"></span>
                            </div>
                            <div id="online-panel" class="hidden" style="padding:0 22px 12px;">
                                <div class="card">
                                    <div style="max-height:260px;overflow-y:auto;">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th><button class="online-sort" data-sort="name" onclick="sortOnlineBy('name')">Jogador <span class="sort-ic" style="font-size:10px;">⇅</span></button></th>
                                                <th><button class="online-sort" data-sort="connected" onclick="sortOnlineBy('connected')">Conectado há <span class="sort-ic" style="font-size:10px;">⇅</span></button></th>
                                                <th><button class="online-sort" data-sort="idle" onclick="sortOnlineBy('idle')">Inativo há <span class="sort-ic" style="font-size:10px;">⇅</span></button></th>
                                                <th>Teleporte</th>
                                                <th>Ação</th>
                                                <th>Reset</th>
                                            </tr>
                                        </thead>
                                        <tbody id="online-list"></tbody>
                                    </table>
                                    </div>
                                </div>
                            </div>
                            <div id="device-panel" class="hidden" style="padding:0 22px 12px;">
                                <div class="card">
                                    <div style="max-height:260px;overflow-y:auto;">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Desde</th><th>Dispositivo</th><th>Motivo</th><th>Usuários</th><th>Ação</th>
                                            </tr>
                                        </thead>
                                        <tbody id="device-list"></tbody>
                                    </table>
                                    </div>
                                </div>
                            </div>
                            <div class="sec-body">
                                <div class="card">
                                    <div style="max-height:calc(100vh - 210px);overflow-y:auto;">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Data</th><th>Jogador</th><th>Tipo</th><th>Função</th><th>Detalhe</th><th>Ação</th>
                                            </tr>
                                        </thead>
                                        <tbody id="event-list"></tbody>
                                    </table>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section id="view-game" class="view hidden">
                            <div class="game-toolbar">
                                <div>
                                    <div class="title">Painel Admin do Jogo</div>
                                    <div class="hint">Regiões · Líderes de Ginásio · Doar · Eventos · Loja Premium · Posições PVP · Novo Pokemon · Criar Cidade · Perfil</div>
                                </div>
                                <button onclick="document.getElementById('game-frame').src=GAME_URL">Recarregar</button>
                            </div>
                            <div class="iframe-wrap">
                                <iframe id="game-frame" src="${GAME_URL}"></iframe>
                            </div>
                        </section>
                    </main>
                </div>`;

            document.querySelectorAll('.nav-btn').forEach(b => {
                b.addEventListener('click', () => switchView(b.dataset.view));
            });

            loadEvents();
            setInterval(loadEvents, 5000);
        }

        /* ==================== Player Detail Popup ==================== */
        let _pdTimer = null;
        let _pdUserId = null;
        let _pdCharId = null;
        let _pdSprites = {};

        function closePlayerDetail() {
            if (_pdTimer) { clearInterval(_pdTimer); _pdTimer = null; }
            _pdUserId = null; _pdCharId = null; _pdSprites = {};
            const el = document.getElementById('pd-overlay');
            if (el) el.remove();
        }

        async function showPlayerDetail(userId, playerName) {
            closePlayerDetail();
            _pdUserId = userId;
            const overlay = document.createElement('div');
            overlay.id = 'pd-overlay';
            overlay.className = 'pd-overlay';
            overlay.innerHTML = `<div class="pd-card" onclick="event.stopPropagation()">
                <div class="pd-head">
                    <div id="pd-avatar-box" class="pd-avatar-fallback">${esc((playerName || '?').charAt(0).toUpperCase())}</div>
                    <div class="pd-info-main">
                        <h2 id="pd-name">${esc(playerName || '...')}</h2>
                        <div class="pd-level" id="pd-level">Carregando...</div>
                    </div>
                    <button class="pd-close" onclick="closePlayerDetail()" title="Fechar">&times;</button>
                </div>
                <div class="pd-body">
                    <div class="pd-section">
                        <div class="pd-section-title">Informações</div>
                        <div id="pd-details" class="pd-details-grid"><div class="pd-loading">Carregando</div></div>
                    </div>
                    <div class="pd-section">
                        <div class="pd-section-title"><span class="pd-live-dot"></span> Time Atual</div>
                        <div id="pd-team"><div class="pd-loading">Carregando</div></div>
                    </div>
                    <div class="pd-section">
                        <div class="pd-section-title">Benefícios Ativos</div>
                        <div id="pd-boosts"><div class="pd-loading">Carregando</div></div>
                    </div>
                    <div class="pd-section">
                        <div class="pd-section-title">Moedas</div>
                        <div id="pd-currencies"><div class="pd-loading">Carregando</div></div>
                    </div>
                </div>
            </div>`;
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closePlayerDetail(); });
            document.body.appendChild(overlay);
            await fetchPlayerDetail();
            _pdTimer = setInterval(fetchPlayerDetail, 5000);
        }

        function getPokemonSpriteUrl(pokemonId) {
            if (_pdSprites[pokemonId]) return _pdSprites[pokemonId];
            const padded = String(pokemonId).padStart(3, '0');
            const url = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemonId}.png`;
            _pdSprites[pokemonId] = url;
            return url;
        }

        async function fetchPlayerDetail() {
            if (!_pdUserId) return;
            try {
                const [{ data: gs }, { data: team }, { data: boosts }, { data: cur }] = await Promise.all([
                    window.db.from('game_saves').select('id,player_name,avatar_url,starter_pokemon,player_gender,trainer_level,created_at').eq('user_id', _pdUserId).order('created_at', { ascending: false }).limit(1).maybeSingle(),
                    _pdCharId ? window.db.from('pokemon_team').select('pokemon_id,species,nickname,level,current_hp,is_shiny,is_mega,slot').eq('character_id', _pdCharId).order('slot') : { data: [] },
                    _pdCharId ? window.db.from('character_boosts').select('boost_type,expires_at').eq('character_id', _pdCharId) : { data: [] },
                    _pdCharId ? window.db.from('character_currencies').select('diamonds,gold,silver').eq('character_id', _pdCharId).maybeSingle() : { data: null }
                ]);
                if (gs) _pdCharId = gs.id;
                renderPlayerDetail(gs, team || [], boosts || [], cur);
            } catch (e) {
                console.error('[PlayerDetail]', e);
            }
        }

        const BOOST_LABELS = { vip: 'VIP', center_anywhere: 'Centro Portátil', shiny_boost: 'Shiny Boost', exp_pokemon: 'EXP Pokemon', exp_trainer: 'EXP Treinador', professor_acompanhante: 'Professor Acompanhante', legendary_boost: 'Lendário Boost' };

        function renderPlayerDetail(gs, team, boosts, cur) {
            const avatarBox = document.getElementById('pd-avatar-box');
            const nameEl = document.getElementById('pd-name');
            const levelEl = document.getElementById('pd-level');
            const detailsEl = document.getElementById('pd-details');
            const teamEl = document.getElementById('pd-team');
            const boostsEl = document.getElementById('pd-boosts');
            const currenciesEl = document.getElementById('pd-currencies');
            if (!nameEl) return;

            if (gs) {
                nameEl.textContent = gs.player_name || '—';
                levelEl.textContent = `Nv. ${gs.trainer_level || 1}`;
                if (gs.avatar_url && avatarBox) {
                    avatarBox.outerHTML = `<img id="pd-avatar-box" class="pd-avatar" src="${esc(gs.avatar_url)}" onerror="this.outerHTML='<div class=\\'pd-avatar-fallback\\'>${esc((gs.player_name || '?').charAt(0).toUpperCase())}</div>'">`;
                }
                const accDate = gs.created_at ? new Date(gs.created_at).toLocaleString('pt-BR') : '—';
                detailsEl.innerHTML = `
                    <div class="pd-detail-item"><span class="pd-label">Conta criada</span><span class="pd-value">${esc(accDate)}</span></div>
                    <div class="pd-detail-item"><span class="pd-label">Gênero</span><span class="pd-value">${esc(gs.player_gender || '—')}</span></div>
                    <div class="pd-detail-item"><span class="pd-label">Pokémon inicial</span><span class="pd-value" style="text-transform:capitalize">${esc(gs.starter_pokemon || '—')}</span></div>
                    <div class="pd-detail-item"><span class="pd-label">Nível</span><span class="pd-value">${esc(gs.trainer_level || 1)}</span></div>`;
            }

            if (team.length > 0) {
                teamEl.innerHTML = team.map(p => {
                    const sprite = getPokemonSpriteUrl(p.pokemon_id);
                    const hpPct = p.current_hp > 0 ? 100 : 0;
                    const hpColor = p.current_hp > 0 ? '#4ade80' : '#ef4444';
                    return `<div class="pd-team-slot">
                        <span class="pd-slot-num">#${p.slot || '?'}</span>
                        ${p.is_shiny ? '<span class="pd-shiny-badge">✨</span>' : ''}
                        <img src="${esc(sprite)}" alt="${esc(p.species || p.nickname || '')}" loading="lazy">
                        <div class="pd-poke-name">${esc(p.nickname || p.species || '—')}</div>
                        <div class="pd-poke-level">Lv. ${esc(p.level || 1)}</div>
                        <div class="pd-hp-bar"><div class="pd-hp-fill" style="width:${hpPct}%;background:${hpColor}"></div></div>
                    </div>`;
                }).join('');
            } else {
                teamEl.innerHTML = '<div class="pd-empty">Nenhum Pokémon no time</div>';
            }

            if (boosts.length > 0) {
                const now = Date.now();
                boostsEl.innerHTML = boosts.filter(b => new Date(b.expires_at) > now).map(b => {
                    const label = BOOST_LABELS[b.boost_type] || b.boost_type;
                    const exp = new Date(b.expires_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    return `<div class="pd-boost-badge">✅ ${esc(label)}<span class="pd-boost-exp">exp: ${esc(exp)}</span></div>`;
                }).join('') || '<div class="pd-empty">Nenhum benefício ativo</div>';
            } else {
                boostsEl.innerHTML = '<div class="pd-empty">Nenhum benefício ativo</div>';
            }

            if (cur) {
                currenciesEl.innerHTML = `<div class="pd-currencies-grid">
                    <div class="pd-currency-card"><div class="pd-cur-icon">💎</div><div class="pd-cur-amount">${esc(cur.diamonds || 0)}</div><div class="pd-cur-label">Diamantes</div></div>
                    <div class="pd-currency-card"><div class="pd-cur-icon" style="color:#eab308">🪙</div><div class="pd-cur-amount">${esc(cur.gold || 0)}</div><div class="pd-cur-label">Ouro</div></div>
                    <div class="pd-currency-card"><div class="pd-cur-icon" style="color:#94a3b8">⚪</div><div class="pd-cur-amount">${esc(cur.silver || 0)}</div><div class="pd-cur-label">Prata</div></div>
                </div>`;
            } else {
                currenciesEl.innerHTML = '<div class="pd-empty">Sem dados de moedas</div>';
            }
        }

        (async function init() {
            if (!window.db) {
                app.innerHTML = '<div class="empty">Falha ao conectar no Supabase.</div>';
                return;
            }
            const session = await ensureSession();
            if (!session) return;
            if (!(await checkAdmin())) {
                app.innerHTML = '<div class="denied"><h2>Acesso negado</h2><p>Esta área é restrita a administradores.</p></div>';
                return;
            }
            renderAdmin(session);
        })();
    </script>
</body>
</html>
